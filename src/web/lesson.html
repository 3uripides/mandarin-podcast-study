<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson - Mandarin Study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M2 4h5M9 14l4-7M14 13l2 3 2-3' fill='none' stroke='%231d5fbf' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lesson-page">
  <div id="banner-slot"></div>
  <header class="top-bar">
    <div class="top-in">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h5M9 14l4-7M14 13l2 3 2-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Mandarin Study
      </a>
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Lessons</a> / <span id="crumb-now">Lesson</span></nav>
      <span class="spacer"></span>
      <button id="theme-toggle" class="ghost" type="button" aria-label="Toggle dark mode">Dark mode</button>
    </div>
  </header>

  <main class="wrap" id="lesson-root">
    <div class="title-row">
      <div>
        <h1 id="lesson-title">Loading...</h1>
        <p class="sub" id="lesson-stats"></p>
      </div>
      <div class="title-actions">
        <a id="transcript-link" href="transcript.html">Transcript</a>
        <button id="complete-btn" type="button">Mark lesson complete</button>
      </div>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Playback">
      <div class="row">
        <button id="prev-btn" type="button" title="Previous (Left)">&#9664; Prev</button>
        <button id="play-btn" type="button" class="play" title="Play / pause (Space)">&#9654; Play episode</button>
        <button id="start-btn" type="button" title="Play the whole episode from the beginning">From start</button>
        <button id="next-btn" type="button" title="Next (Right)">Next &#9654;</button>
        <button id="replay-btn" type="button" class="phone-hide" title="Replay (R)">Replay</button>
        <button id="loop-btn" type="button" class="phone-hide" title="Loop (L)">Loop</button>
        <button id="slow-btn" type="button" class="phone-hide" title="Slow 0.75x (S)">Slow</button>
        <button id="rec-btn" type="button" title="Record (M)">Record</button>
        <button id="cmp-btn" type="button" class="phone-hide" disabled title="Original, then yours">Compare</button>
        <button id="more-btn" type="button" class="more-only" aria-expanded="false">More</button>
      </div>
      <div class="row secondary">
        <span class="label" id="section-label">Section</span>
        <select id="section-sel" aria-labelledby="section-label"></select>
        <button id="section-btn" type="button">Play section</button>
        <button id="range-btn" type="button" disabled>Play selection</button>
        <button id="clear-sel-btn" type="button" disabled>Clear selection</button>
      </div>
      <div class="row secondary">
        <button id="autopause-btn" type="button" title="Pause after each sentence">Auto-pause</button>
        <button id="autoadv-btn" type="button" title="Advance to next sentence after clip">Auto-advance</button>
        <button id="zhonly-btn" type="button" title="Hide English lines">Mandarin lines only</button>
        <span class="label">Show</span>
        <button id="chars-btn" type="button" title="Chinese characters (1)">Chinese chars</button>
        <button id="pinyin-btn" type="button" title="Pinyin (2)">Pinyin</button>
        <button id="english-btn" type="button" title="English (3)">English</button>
      </div>
      <div class="now" id="now-line" aria-live="polite"></div>
    </div>

    <div id="transcript" class="transcript"></div>
    <p class="footnote">Shortcuts: Space play/pause · R replay · L loop · S slow · Left/Right prev/next · M record · 1/2/3 chars/pinyin/English · W save word · T save sentence</p>
  </main>

  <!-- fixed episode player: seek anywhere across the whole lesson -->
  <div class="playbar" id="playbar" role="region" aria-label="Episode player">
    <div class="pb-row">
      <button id="bar-prev" type="button" aria-label="Previous line" title="Previous line (Left)">&#9664;&#9664;</button>
      <button id="bar-play" type="button" class="pb-play" aria-label="Play" title="Play / pause (Space)">&#9654;</button>
      <button id="bar-next" type="button" aria-label="Next line" title="Next line (Right)">&#9654;&#9654;</button>
      <span class="pb-time" id="bar-time">0:00 / 0:00</span>
      <span class="pb-rem" id="bar-rem">-0:00</span>
    </div>
    <div class="pb-seek" id="seek" role="slider" tabindex="0" aria-label="Lesson position"
         aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
      <div class="pb-track"><div class="pb-fill" id="seek-fill"></div><div class="pb-thumb" id="seek-thumb"></div></div>
      <div class="pb-ticks" id="seek-ticks"></div>
    </div>
  </div>

  <audio id="ep" preload="auto"></audio>
  <audio id="clipaudio" preload="auto"></audio>
  <script src="app.js"></script>
</body>
</html>
