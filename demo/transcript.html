<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transcript - Mandarin Study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath d='M2 4h5M9 14l4-7M14 13l2 3 2-3' fill='none' stroke='%231d5fbf' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* Printable transcript. Same tokens as style.css (achromatic ledger). Print rules at the end. */
    @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap");
    :root {
      --ground: #f5f4f0; --surface: #ffffff; --raised: #ebeae6; --border: #e3e1db; --control: #c9c6bd;
      --text: #161616; --muted: #5d5a53; --accent: #1d5fbf; --positive: #247b50;
      --pill-positive-bg: #dcfae5; --pill-positive-ink: #04250e;
      --font: "Geist", "Segoe UI", system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, Consolas, monospace;
      --cjk: var(--font);
    }
    @media screen and (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ground: #000000; --surface: #111111; --raised: #222222; --border: #1f1f1f; --control: #444444;
        --text: #ffffff; --muted: #b4b4b4; --accent: #6ea8ff; --positive: #3fc07a;
        --pill-positive-bg: #172a1d; --pill-positive-ink: #3fc07a;
      }
    }
    @page { size: A4; margin: 16mm 14mm; }
    * { box-sizing: border-box; }
    html, body { background: var(--ground); color: var(--text); margin: 0; }
    body {
      font-family: var(--font); font-size: 16px; line-height: 1.5; padding: 24px; max-width: 880px; margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--text); text-underline-offset: 3px; }
    button, input { font: inherit; color: inherit; }
    button {
      background: var(--surface); border: 1px solid var(--control); border-radius: 6px;
      padding: 0 14px; min-height: 36px; cursor: pointer;
    }
    button.primary { background: var(--text); color: var(--ground); border-color: var(--text); }
    header { padding-bottom: 6px; }
    header .sub { color: var(--muted); font-size: 13px; }
    header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.015em; margin: 6px 0 4px; line-height: 1.2; }
    header .meta { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 16px 0 22px;
      padding: 12px 16px; background: var(--surface); border-radius: 8px;
    }
    .controls label { display: flex; gap: 6px; align-items: center; min-height: 32px; font-size: 14px; }
    .controls input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--text); margin: 0; }
    .hint { color: var(--muted); font-size: 13px; flex-basis: 100%; }
    h2.sec {
      font-size: 13px; font-weight: 500; color: var(--muted); margin: 26px 0 4px; padding: 0 2px; break-after: avoid;
    }
    /* a line is a ledger row: time in mono, the content on the right */
    .line {
      display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: start;
      padding: 12px 16px; margin: 6px 0; background: var(--surface);
      border-radius: 8px; break-inside: avoid;
    }
    .line.en-line { background: transparent; border-color: transparent; padding: 4px 16px; }
    .ts { font-family: var(--mono); color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 6px; }
    .line .body { min-width: 0; }
    .py { font-size: 19px; line-height: 1.35; font-weight: 500; }
    .hanzi { font-family: var(--cjk); font-size: 24px; line-height: 1.35; margin-top: 2px; }
    .en { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .en-text { font-size: 15px; line-height: 1.55; }
    /* show/hide from the checkboxes */
    .hide-chars .hanzi { display: none; }
    .hide-py .py { display: none; }
    .hide-en .en { display: none; }
    .hide-ts .ts { display: none; }
    .empty { color: var(--muted); }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .line { grid-template-columns: 44px minmax(0, 1fr); gap: 10px; }
      .py { font-size: 18px; }
    }

    @media print {
      :root { --ground: #fff; --surface: #fff; --raised: #fff; --border: #bbb; --control: #999; --text: #000; --muted: #333; --accent: #000; --positive: #000; --pill-positive-bg: #fff; --pill-positive-ink: #000; }
      html, body { background: #fff; color: #000; }
      body { padding: 0; max-width: none; font-size: 11pt; line-height: 1.4; }
      .no-print { display: none !important; }
      .line { border: 0; border-bottom: 1px solid #ddd; border-radius: 0; padding: 6px 0; margin: 0; }
      .line.en-line { border-bottom-color: transparent; }
      .hanzi { font-size: 15pt; }
      .py { font-size: 11pt; }
      .en-text { font-size: 10.5pt; }
      .ts { font-size: 9pt; padding-top: 3px; }
      h2.sec { color: #000; border-bottom: 0; font-size: 10pt; margin-top: 14pt; }
      a { color: #000; text-decoration: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="sub no-print"><a id="back" href="index.html">&larr; All lessons</a></div>
    <h1 id="title">Loading...</h1>
    <div class="meta" id="sub"></div>
  </header>

  <div class="controls no-print" role="group" aria-label="Transcript options">
    <label><input type="checkbox" id="c-chars" checked> Chinese characters</label>
    <label><input type="checkbox" id="c-py" checked> Pinyin</label>
    <label><input type="checkbox" id="c-en" checked> English translation</label>
    <label><input type="checkbox" id="c-ts" checked> Timestamps</label>
    <button id="pdf-btn" class="primary" type="button">Download PDF</button>
    <span class="hint">Then, in the print dialog, choose &ldquo;Save as PDF&rdquo; as the destination.</span>
  </div>

  <main id="tx" aria-live="polite"></main>

  <script src="shim.js"></script>
  <script src="transcript.js"></script>
</body>
</html>
